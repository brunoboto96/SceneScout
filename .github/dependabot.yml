# Version updates. Security updates are enabled separately in the repository
# settings. The major-version ignores below may also hold back a security
# fix that only exists in that next major, so watch Dependabot ALERTS for
# typescript rather than relying on a pull request appearing.
#
# Cooldown (ADR 34): a release is not proposed until it is a week old, or a
# month for a major, so a broken or compromised release is usually pulled
# before it reaches a pull request. GitHub applies cooldown to version updates
# only: a security update is opened as soon as the advisory is published.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      # One PR for routine bumps instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose — see "Pinned dependencies" in AGENTS.md.
      # TypeScript 7 has no stable JavaScript compiler API, which two test suites use.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must describe the OLDEST supported Node (engines: >=22.19.0), or
      # the compiler stops flagging APIs that do not exist there. Move this
      # major with the engines floor, ADR 34.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Playwright 1.64 hangs a click whose navigation is answered with 204 No
      # Content (#487). Remove this once a release fixes it.
      - dependency-name: "playwright"
        versions: [">=1.64.0 <1.65.0"]

  - package-ecosystem: github-actions
    # / reads .github/workflows and the root action.yml only; the ci and qa
    # actions pin their own actions by commit, so their folders are listed too,
    # and so is the folder of example workflows users copy.
    directories: ["/", "/ci", "/qa", "/examples/workflows"]
    schedule:
      interval: weekly
    # Actions take only default-days; a major waits the same week.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
