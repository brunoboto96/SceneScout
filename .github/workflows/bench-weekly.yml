# The weekly benchmark: an unattended `scenescout ci` run of the latest release
# against the demo and the held-out app, scored against their answer keys and
# recorded, one row per app, in bench/ci-results.json and the table in
# docs/benchmark.md ("Unattended runs"). How it is read: docs/benchmark.md.
#
# It runs only when a release has come out since the newest version the
# schedule recorded for the provider it would use, and no results pull request
# is still open; otherwise it writes one line to the job summary and stops.
# Dispatched by hand, `force` runs it anyway. A release whose tag predates
# `scenescout ci` is never run.
#
# Three jobs, so no job holds both the model's key and a token that can write:
#   decide  reads the repository and the latest release, and says whether to run.
#   bench   calls ci-benchmark.yml once per app, on the release tag. It holds the
#           key of the one provider in use, and can only read the repository.
#   record  holds no key. It scores the uploaded runs, archives them, and opens
#           a pull request with the results: main takes changes only by pull
#           request, and the results are reviewed like anything else.
# test-results-pr then starts the required checks on that pull request, which
# GitHub does not do for one opened with the Actions token.
#
# ci-test holds this workflow to those triggers, permissions and key placement.
name: bench-weekly

on:
  schedule:
    # Mondays, 06:17 UTC: off the hour, when scheduled runs queue longest.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Run even if nothing has been released since the last recorded run.
        type: boolean
        default: false
      provider:
        description: The model's provider. Only that provider's key is used.
        type: choice
        options: [openai, anthropic]
        default: openai
      model:
        description: The model id. Empty means the CLI's default for the provider.
        type: string
        default: ""
      effort:
        description: Reasoning effort. Empty means the CLI's default.
        type: string
        default: ""

permissions: {}

# One benchmark at a time: two would both find the same release unrecorded.
concurrency:
  group: bench-weekly
  cancel-in-progress: false

jobs:
  decide:
    if: github.repository == 'brunoboto96/SceneScout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Reading the label the results pull request will carry.
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      provider: ${{ steps.decide.outputs.provider }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts

      - name: The latest release
        shell: bash
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::the latest release's tag is not vX.Y.Z: $tag"; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Checked before any model call: a results pull request that cannot be labelled would fail after the money is spent.
      - name: The benchmark label exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh api "repos/$GH_REPO/labels/benchmark" > /dev/null; then
            echo "::error::create a label named benchmark: the results pull request carries it"; exit 1
          fi

      - name: Decide
        id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          LATEST: ${{ steps.release.outputs.version }}
          PROVIDER: ${{ inputs.provider || 'openai' }}
          FORCE: ${{ inputs.force == true }}
        run: |
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
          # Results not merged yet leave main's record behind: running again would pay for the same release twice.
          open_prs=$(gh pr list --state open --label benchmark --json number --jq length)
          # A tag from before scenescout ci has no ci action; a run of it could only fail.
          git fetch --no-tags --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          if git cat-file -e "$TAG:ci/action.yml" 2>/dev/null; then has_ci=true; else has_ci=false; fi
          force=()
          if [ "$FORCE" = true ]; then force=(--force); fi
          npm run -s bench:ci -- decide --latest "$LATEST" --provider "$PROVIDER" --open-prs "$open_prs" --release-has-ci "$has_ci" "${force[@]}"

  bench:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [demo, holdout]
    uses: ./.github/workflows/ci-benchmark.yml
    with:
      app: ${{ matrix.app }}
      provider: ${{ needs.decide.outputs.provider }}
      model: ${{ inputs.model || '' }}
      effort: ${{ inputs.effort || '' }}
      ref: ${{ needs.decide.outputs.tag }}
    secrets:
      OPENAI_API_KEY: ${{ needs.decide.outputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
      ANTHROPIC_API_KEY: ${{ needs.decide.outputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}

  # Whatever the apps' runs did: one app failing must not discard the other's paid run.
  record:
    needs: [decide, bench]
    if: always() && needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the results branch
      pull-requests: write # open the results pull request
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # --ignore-scripts: no dependency's install script runs in a job that can push.
      - run: npm ci --ignore-scripts

      # One directory per app: runs/scenescout-ci-benchmark-<app>/.scenescout/…
      # A failed app uploads nothing; the next step says so rather than this one failing.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: scenescout-ci-benchmark-*
          path: ${{ runner.temp }}/runs

      - name: Score, archive and record each app
        shell: bash
        env:
          RUNS: ${{ runner.temp }}/runs
          SOURCE: ${{ github.event_name == 'schedule' && 'scheduled' || 'dispatched' }}
          COMMIT: ${{ needs.bench.outputs.commit }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          today=$(date -u +%F)
          recorded=0
          : > "$RUNNER_TEMP/scorecards.txt"
          for app in demo holdout; do
            dir="$RUNS/scenescout-ci-benchmark-$app"
            if [ ! -s "$dir/.scenescout/ci/ci.json" ]; then
              echo "::warning::the $app run left nothing to record: its job failed"
              echo "The $app run failed; nothing recorded for it." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            version=$(node -p 'require(process.argv[1]).version' "$dir/.scenescout/ci/ci.json")
            name="ci-$app-${version//./-}-$RUN_NUMBER"
            card="$RUNNER_TEMP/$app-scorecard.json"
            npm run -s bench -- "$dir" --app "$app" --json "$card" | tee -a "$RUNNER_TEMP/scorecards.txt"
            npm run -s bench -- --archive "$dir" --app "$app" --run "$name" --date "$today" \
              --note "Unattended scenescout ci run ($SOURCE) of v$version; see Unattended runs."
            npm run -s bench:ci -- record --app "$app" --project "$dir" --card "$card" \
              --source "$SOURCE" --commit "$COMMIT" --archive "$name" --date "$today"
            recorded=$((recorded + 1))
          done
          if [ "$recorded" -eq 0 ]; then echo "::error::neither app's run can be recorded"; exit 1; fi
          npx prettier --write bench/ci-results.json bench/runs docs/benchmark.md > /dev/null
          { echo "### Weekly benchmark"; echo; echo '```'; cat "$RUNNER_TEMP/scorecards.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Open the results pull request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.decide.outputs.version }}
          PROVIDER: ${{ needs.decide.outputs.provider }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: bench/ci-results-${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add bench/ci-results.json bench/runs docs/benchmark.md
          git commit -m "Record the unattended benchmark of v$VERSION ($PROVIDER)"
          # The branch is this run's alone (its id is in the name): a re-run replaces what an earlier attempt pushed,
          # leased on the commit that attempt left, and reuses its pull request.
          lease=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          git push --force-with-lease="refs/heads/$BRANCH:$lease" origin "HEAD:refs/heads/$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ -n "$(gh pr list --state open --head "$BRANCH" --json number --jq '.[].number')" ]; then
            echo "The pull request for $BRANCH is already open; its branch now holds this attempt's results."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" --label benchmark \
            --title "Record the unattended benchmark of v$VERSION ($PROVIDER)" \
            --body "The weekly benchmark workflow ran \`scenescout ci\` of v$VERSION against the demo and the held-out app ($RUN_URL; its summary names any app whose run failed). This appends a row per recorded app to bench/ci-results.json, archives each run under bench/runs/ and regenerates the table in docs/benchmark.md. No code changes."

  # A separate job, as in the release workflow: the permission to start
  # workflows is never held by the job that can push.
  test-results-pr:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run the required checks on the results pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ needs.record.outputs.branch }}
        run: |
          gh workflow run test.yml --ref "$BRANCH"
          gh workflow run wave-hold.yml --ref "$BRANCH"
