# One real `scenescout ci` run against a benchmark app. The model's key is a
# repository secret, which is why this runs here rather than on a laptop. It
# scores nothing and commits nothing: it uploads the run's project directory.
#
# Started by hand, the run is scored locally with
#
#   gh run download <run id> -n <artifact name> -D bench-run
#   npm run bench -- bench-run --app <demo|holdout>
#
# The weekly benchmark (bench-weekly.yml) calls it once per app, then scores
# and records the runs in a job of its own that never holds the key.
#
# Only workflow_dispatch and workflow_call, never pull_request or
# pull_request_target: the job holds the key, so it runs only the code of a ref
# someone with write access chose, or the release tag the weekly run names.
# ci-test holds this workflow to those triggers and to read-only permissions.
name: ci-benchmark

on:
  workflow_dispatch:
    inputs:
      app:
        description: The benchmark app to run against.
        type: choice
        options: [demo, holdout]
        default: demo
      provider:
        description: The model's provider. Only that provider's key reaches the run.
        type: choice
        options: [openai, anthropic]
        default: openai
      model:
        description: The model id. Empty means the CLI's default.
        type: string
        default: ""
      effort:
        description: Reasoning effort (none, low, medium, high, xhigh, max). Empty means the CLI's default.
        type: string
        default: ""
  workflow_call:
    inputs:
      app:
        description: demo or holdout.
        type: string
        required: true
      provider:
        description: openai or anthropic. Only that provider's key reaches the run.
        type: string
        default: openai
      model:
        description: The model id. Empty means the CLI's default.
        type: string
        default: ""
      effort:
        description: Reasoning effort. Empty means the CLI's default.
        type: string
        default: ""
      ref:
        description: The ref to check out and run, e.g. a release tag. Empty means the calling workflow's.
        type: string
        default: ""
    secrets:
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
    outputs:
      commit:
        description: The commit that ran.
        value: ${{ jobs.run.outputs.commit }}

permissions:
  contents: read

jobs:
  run:
    name: scenescout ci · ${{ inputs.app }}
    runs-on: ubuntu-latest
    # 20 minutes of exploration, up to 4 more to write the report, and the setup before it.
    timeout-minutes: 40
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      # The job holds a model's key, so it runs only a release tag, main or a
      # full commit id: checked before anything is checked out.
      - name: The ref is a release, main or a commit
        env:
          REF: ${{ inputs.ref }}
        run: |
          if [ -n "$REF" ] && ! [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$|^main$|^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a release tag (vX.Y.Z), main or a full commit id, not $REF"; exit 1
          fi
      # No actions cache anywhere in this job (setup-node's included): what a
      # job that checks out a chosen ref saves, later runs on main would restore.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build

      - name: Start the ${{ inputs.app }} app
        id: app
        env:
          APP: ${{ inputs.app }}
        run: |
          if [ "$APP" = holdout ]; then port=4180; else port=4173; fi
          npm run "$APP:serve" > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null "http://127.0.0.1:$port/"; then
              echo "url=http://127.0.0.1:$port" >> "$GITHUB_OUTPUT"
              # A fresh project directory: bench scores everything in its memory, so it must hold this run only.
              mkdir -p "$RUNNER_TEMP/bench-run"
              echo "project=$RUNNER_TEMP/bench-run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 1
          done
          echo "The $APP app did not answer on port $port:"; cat "$RUNNER_TEMP/app.log"; exit 1

      - name: CI run
        id: run
        uses: ./ci
        # Only the chosen provider's key: a run is never charged to the other one.
        env:
          OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
        with:
          url: ${{ steps.app.outputs.url }}
          cli: dist/cli.js
          provider: ${{ inputs.provider }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          project: ${{ steps.app.outputs.project }}
          upload-artifact: "false"
          upload-sarif: "false"
          cache: "false"

      - name: No key in what will be uploaded
        env:
          OPENAI_API_KEY: ${{ inputs.provider == 'openai' && secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          PROJECT: ${{ steps.app.outputs.project }}
        run: |
          test -s "$PROJECT/.scenescout/memory.json"
          for key in "$OPENAI_API_KEY" "$ANTHROPIC_API_KEY"; do
            [ -n "$key" ] || continue
            if grep -rlF -- "$key" "$PROJECT"; then echo "::error::the key appears in the files above; nothing is uploaded"; exit 1; fi
          done

      - name: Usage
        env:
          SUMMARY: ${{ steps.run.outputs.summary }}
          APP: ${{ inputs.app }}
          STOP: ${{ steps.run.outputs.stop }}
        run: |
          {
            echo "### Benchmark run on the $APP app"
            echo
            echo "Ended: $STOP. $(grep '^| Usage |' "$SUMMARY" | sed -e 's/^| Usage | //' -e 's/ |$//')"
            echo
            echo "Score it locally: download the \`scenescout-ci-benchmark-$APP\` artifact into a directory and run \`npm run bench -- <that directory> --app $APP\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # The project directory itself, so the artifact unpacks to the layout bench reads: <dir>/.scenescout/memory.json.
      - name: Keep the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scenescout-ci-benchmark-${{ inputs.app }}
          path: ${{ steps.app.outputs.project }}
          include-hidden-files: true
          if-no-files-found: error
