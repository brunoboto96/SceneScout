name: guide-wiki

# Publishes the guide in docs/guide/ to the repository's GitHub wiki.
#
# The pages are written and reviewed in the repository; the wiki is a copy,
# replaced on every publish, so an edit made in the wiki's web editor is lost
# at the next one. Links between guide pages are rewritten for the wiki, and
# links to the rest of the repository point at the published ref
# (scripts/guide-wiki.mjs; guide-test covers both).
#
# When it runs:
#   - on a release being published. A release made by the release workflow
#     does not start this (events made with the workflow's own token start no
#     workflows), so that workflow dispatches this one after publishing;
#   - by hand (workflow_dispatch), for a tag, or the latest release when no
#     ref is given.
#
# Nothing from a pull request runs here: neither trigger carries one, and the
# ref must be a release tag or main.
#
# Two jobs. `build` checks out the ref and runs the repository's transform
# with a read-only token, and hands the pages over as an artifact. `publish`
# checks nothing out and runs no repository code: it downloads the pages and
# pushes them with git. Only `publish` has contents: write, and only its push
# step holds a token that can write: the workflow's own GITHUB_TOKEN, or, if a
# repository setting stops that token pushing to the wiki, the one secret the
# job's error names, GUIDE_WIKI_TOKEN (a fine-grained personal access token
# for this repository with Contents read and write).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: The release tag (vX.Y.Z) or main whose guide to publish. Empty means the latest release.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: guide-wiki
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'brunoboto96/SceneScout'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Choose the ref to publish
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          ref="${RELEASE_TAG:-$INPUT_REF}"
          if [ -z "$ref" ]; then ref=$(gh release view --json tagName --jq .tagName); fi
          if ! printf '%s' "$ref" | grep -Eq '^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?|main)$'; then
            echo "::error title=Not a release ref::\"$ref\" is neither a release tag (vX.Y.Z) nor main."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build the wiki pages
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: node scripts/guide-wiki.mjs --src docs/guide --out "$RUNNER_TEMP/wiki-pages" --repo "$GITHUB_REPOSITORY" --ref "$REF"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wiki-pages
          path: ${{ runner.temp }}/wiki-pages/*.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push to the wiki repository
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wiki-pages
          path: ${{ runner.temp }}/wiki-pages

      # git and the downloaded pages only: nothing from the repository runs here.
      - name: Push to the wiki
        env:
          WIKI_TOKEN: ${{ secrets.GUIDE_WIKI_TOKEN || github.token }}
          REF: ${{ needs.build.outputs.ref }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$WIKI_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          header="AUTHORIZATION: basic $auth"
          wiki="$RUNNER_TEMP/wiki"
          if ! git -c http.extraheader="$header" clone --depth 1 "https://github.com/$GITHUB_REPOSITORY.wiki.git" "$wiki"; then
            echo "::error title=Wiki not reachable::Could not clone $GITHUB_REPOSITORY.wiki.git. The wiki must be enabled (Settings → Features → Wikis) and hold at least one page: create any page once in the web interface, and the next publish replaces it."
            exit 1
          fi
          cd "$wiki"
          # The wiki mirrors docs/guide: pages removed there are removed here.
          find . -maxdepth 1 -type f -name '*.md' -delete
          cp "$RUNNER_TEMP"/wiki-pages/*.md .
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches the guide at $REF."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --quiet -m "Publish the guide from $REF"
          if ! git -c http.extraheader="$header" push --quiet origin HEAD; then
            echo "::error title=Wiki push refused::The token could not push to $GITHUB_REPOSITORY.wiki.git. Add a repository secret named GUIDE_WIKI_TOKEN holding a fine-grained personal access token for this repository with Contents: read and write, then run this workflow again."
            exit 1
          fi
          echo "Published the guide from $REF to the wiki."
