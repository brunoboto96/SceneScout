name: release

# How a release happens:
#   1. Pull requests carry changesets (see .changeset/README.md).
#   2. On every push to main this workflow collects them into a "Version
#      Packages" pull request: version bump, CHANGELOG.md, plugin.json. It then
#      starts the test workflow on that branch, because GitHub does not run
#      pull_request workflows for a pull request opened with the Actions token.
#   3. The maintainer approves and merges that pull request. This workflow runs
#      again, finds no pending changesets, and publishes to npm, tags vX.Y.Z
#      and creates the GitHub Release.
#
# Publishing uses npm trusted publishing (OIDC): npm verifies that the request
# comes from THIS workflow in THIS repository, so no npm token is stored
# anywhere. Only the PUBLISH step is switched on by the repository variable
# NPM_PUBLISH=enabled, set once the package exists on npm and the trusted
# publisher is configured. The version pull request is opened either way, so
# merged changesets never pile up unseen.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A merged pull request labelled `skip-publish` makes this push a no-op for
  # releases: no version pull request is opened or updated, nothing is
  # published. Docs-only changes do not need it — without a changeset nothing is
  # released anyway — so it is an explicit override, for example to land several
  # changes before the version pull request is refreshed.
  gate:
    if: github.repository == 'brunoboto96/SceneScout'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.label.outputs.skip }}
    steps:
      - id: label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          labels=$(gh api "repos/$GH_REPO/commits/${{ github.sha }}/pulls" --jq '[.[].labels[].name] | join(",")')
          echo "labels on the merged pull request: ${labels:-none}"
          if echo ",$labels," | grep -q ",skip-publish,"; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  release:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the version branch, tags and the GitHub Release
      pull-requests: write # open the "Version Packages" pull request
      id-token: write # npm trusted publishing + provenance
    outputs:
      pr-number: ${{ steps.changesets.outputs.pr-number }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets reads history to work out what changed, and pushes a branch.
          fetch-depth: 0
      # No `registry-url` here on purpose: it makes setup-node write an .npmrc
      # that expects NODE_AUTH_TOKEN, and a configured-but-empty token stops
      # npm from taking the trusted-publishing path.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer. Pinned, not @latest: this
      # job can publish, so what runs in it should not change on its own.
      - run: npm install -g npm@11.19.1
      # --ignore-scripts: no dependency's install script runs in a job that can
      # mint a publish token. The build the release needs is run explicitly by
      # `npm run release`.
      - run: npm ci --ignore-scripts
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: npm run version-packages
          # Empty while publishing is off: the action then opens or updates the
          # version pull request and publishes nothing.
          publish-script: ${{ vars.NPM_PUBLISH == 'enabled' && 'npm run release' || '' }}
          pr-title: Version Packages
          commit-message: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A separate job, so the permission to start workflows is never held by the
  # job that runs repository code and can publish. It keys off pr-number, which
  # the action sets only after it has pushed the version branch and opened or
  # updated the pull request; has-changesets is also true for an empty
  # changeset, where no branch exists to run on.
  test-version-pr:
    needs: release
    if: needs.release.outputs.pr-number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run the test suite on the version pull request
        run: gh workflow run test.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
