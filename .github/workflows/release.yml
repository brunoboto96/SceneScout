name: release

# How a release happens:
#   1. Pull requests carry changesets (see .changeset/README.md).
#   2. On every push to main the `version` job collects them into a "Version
#      Packages" pull request: version bump, CHANGELOG.md, plugin.json. It then
#      starts the test workflow on that branch, because GitHub does not run
#      pull_request workflows for a pull request opened with the Actions token.
#   3. The maintainer approves and merges that pull request. This workflow runs
#      again and finds no pending changesets. `build` asks npm whether it has
#      this version; when it does not, `build` packs the tarball, `publish`
#      sends it to npm, and only then does `release` tag vX.Y.Z, create the
#      GitHub Release and move the major tag. The desktop extension and the
#      wiki follow the release.
#
#   gate ─► version ─► build ─► publish ─► release ─┬─► publish-guide
#              │      (pack)   (npm,       (tag,    └─► desktop-extension ─┬─► attach-desktop-extension
#              │               id-token)   Release,                        └─► attest-desktop-extension
#              └─► test-version-pr          v3)
#
# Publishing uses npm trusted publishing (OIDC): npm verifies that the request
# comes from THIS workflow in THIS repository, so no npm token is stored
# anywhere. The permission to mint that token is held by `publish`, which checks
# nothing out, installs nothing and runs none of this repository's code: it
# downloads the tarball `build` made and hands it to npm (ADR 27).
#
# Only publishing is switched on by the repository variable NPM_PUBLISH=enabled.
# The version pull request is opened either way, so merged changesets never pile
# up unseen.
#
# A rehearsal: run this workflow by hand on main with `dry-run` ticked (the
# default). Every job runs against the current version, `npm publish` runs with
# --dry-run, and nothing is tagged, released, attached or attested.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Rehearse: run every job against the current version with npm publish --dry-run, and tag or release nothing"
        type: boolean
        default: true

# A rehearsal writes nothing, so it queues apart: in the same group it could
# displace a push's run waiting behind the one in progress.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && 'release-rehearsal' || 'release' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A merged pull request labelled `skip-publish` makes this push a no-op for
  # releases: no version pull request is opened or updated, nothing is
  # published. Docs-only changes do not need it — without a changeset nothing is
  # released anyway — so it is an explicit override, for example to land several
  # changes before the version pull request is refreshed.
  #
  # A run started by hand is a rehearsal unless `dry-run` is unticked, and runs
  # only on main: trusted publishing names the workflow file, not the branch.
  gate:
    if: github.repository == 'brunoboto96/SceneScout' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      skip: ${{ steps.label.outputs.skip }}
      dry-run: ${{ steps.label.outputs.dry-run }}
    steps:
      - id: label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry-run }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [ "$DRY_RUN" = "false" ]; then echo "dry-run=false" >> "$GITHUB_OUTPUT"; else echo "dry-run=true" >> "$GITHUB_OUTPUT"; fi
            echo "started by hand; dry-run: ${DRY_RUN:-true}"
            exit 0
          fi
          echo "dry-run=false" >> "$GITHUB_OUTPUT"
          labels=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '[.[].labels[].name] | join(",")')
          echo "labels on the merged pull request: ${labels:-none}"
          if echo ",$labels," | grep -q ",skip-publish,"; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

  # Opens or updates the "Version Packages" pull request. It never publishes:
  # no publish-script, and no GitHub Release from the action. A rehearsal skips it.
  version:
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the version branch
      pull-requests: write # open the "Version Packages" pull request
    outputs:
      pr-number: ${{ steps.changesets.outputs.pr-number }}
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changesets reads history to work out what changed, and pushes a branch.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        with:
          version-script: npm run version-packages
          pr-title: Version Packages
          commit-message: Version Packages
          create-github-releases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A separate job, so the permission to start workflows is never held by a job
  # that runs repository code. It keys off pr-number, which the action sets only
  # after it has pushed the version branch and opened or updated the pull
  # request; has-changesets is also true for an empty changeset, where no branch
  # exists to run on.
  test-version-pr:
    needs: version
    if: needs.version.outputs.pr-number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run the test suite on the version pull request
        run: gh workflow run test.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - name: Run the wave hold check on the version pull request
        run: gh workflow run wave-hold.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Decides whether to publish by asking npm whether it has this commit's
  # version, not by looking for a git tag: a version a failed run left
  # unpublished is published by the next run on main that finds no pending
  # changesets. When it publishes, it
  # builds from a clean dist and packs the tarball once. It can write nothing.
  build:
    needs: [gate, version]
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.skip != 'true' &&
      (needs.gate.outputs.dry-run == 'true' || (needs.version.result == 'success' && needs.version.outputs.has-changesets == 'false')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      dist-tag: ${{ steps.plan.outputs.dist-tag }}
      publish: ${{ steps.plan.outputs.publish }}
      dry-run: ${{ needs.gate.outputs.dry-run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Decide whether npm needs this version
        id: plan
        env:
          DRY_RUN: ${{ needs.gate.outputs.dry-run }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: node scripts/release-plan.mjs
      - if: steps.plan.outputs.publish == 'true'
        run: npm ci --ignore-scripts
      - if: steps.plan.outputs.publish == 'true'
        run: npm run build
      # --ignore-scripts: `prepare` would only build again. The folder is made
      # first, because npm pack does not create its destination.
      - name: Pack the tarball
        if: steps.plan.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          mkdir -p package
          npm pack --ignore-scripts --pack-destination package
          test -f "package/scenescout-$VERSION.tgz" || { echo "::error title=Tarball missing::npm pack did not write scenescout-$VERSION.tgz"; ls -la package; exit 1; }
      - if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: package/scenescout-${{ steps.plan.outputs.version }}.tgz
          if-no-files-found: error

  # The only job that can mint the npm token. No checkout, no install, none of
  # this repository's code: it downloads the tarball and hands it to npm.
  publish:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance
    steps:
      # No `registry-url` here on purpose: it makes setup-node write an .npmrc
      # that expects NODE_AUTH_TOKEN, and a configured-but-empty token stops
      # npm from taking the trusted-publishing path. No `cache` either: it reads
      # a lockfile, and there is no checkout.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Trusted publishing needs npm 11.5.1 or newer. Pinned, not @latest: this
      # job can publish, so what runs in it should not change on its own.
      - run: npm install -g npm@11.19.1 --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package
      # A rehearsal adds --dry-run, which sends nothing, and --force, which only
      # skips npm's refusal to publish over a version it already has (the
      # current version always is). If npm could not exchange this job's OIDC
      # token, a dry run only warns that it is not logged in; the rehearsal
      # fails on that warning, so it also proves the trusted publisher works.
      - name: Publish to npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          DRY_RUN: ${{ needs.build.outputs.dry-run }}
        run: |
          # The leading ./ matters: npm reads "package/x.tgz" as a GitHub repository.
          tarball="./package/scenescout-$VERSION.tgz"
          test -f "$tarball" || { echo "::error title=Tarball missing::$tarball was not downloaded"; exit 1; }
          if [ "$DRY_RUN" = "true" ]; then
            npm publish "$tarball" --provenance --access public --tag "$DIST_TAG" --ignore-scripts --dry-run --force 2>&1 | tee publish.log
            if grep -q "requires you to be logged in" publish.log; then
              echo "::error title=Trusted publishing not set up::npm did not accept this job's OIDC token, so a real publish would be refused. Check the trusted publisher on npmjs.com names release.yml."
              exit 1
            fi
          elif ! npm publish "$tarball" --provenance --access public --tag "$DIST_TAG" --ignore-scripts; then
            # npm can store the version and still fail the request, and a re-run is then refused as a
            # publish over it. When npm has this version with this tarball's integrity, this publish
            # landed: carry on, so re-running the failed jobs finishes the release.
            want="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
            have=$(npm view "scenescout@$VERSION" dist.integrity --prefer-online 2> /dev/null || true)
            [ "$have" = "$want" ] || exit 1
            echo "::notice title=Already on npm::npm has scenescout@$VERSION with this tarball's integrity, so it was published; carrying on to the release."
          fi

  # Runs only after npm has the version, so the tag, the GitHub Release and the
  # major tag never name a version npm lacks (the plugin installs the exact
  # version, #574). A rehearsal makes the tag in the runner and pushes nothing.
  release:
    needs: [build, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the tag and create the GitHub Release
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The existing tags, so `changeset git-tag` skips one already made.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tag the release
        id: tag
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DRY_RUN: ${{ needs.build.outputs.dry-run }}
        run: |
          tag="v$VERSION"
          # `changeset git-tag` makes an annotated tag, which needs an identity.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx --no changeset git-tag
          git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null || { echo "::error title=No tag::changeset git-tag did not make $tag"; exit 1; }
          if [ "$DRY_RUN" = "true" ]; then
            echo "Rehearsal: $tag is at $(git rev-parse "$tag^{commit}"); nothing is pushed."
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-parse "$tag^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error title=Tag elsewhere::$tag already names another commit; npm has $VERSION from $GITHUB_SHA. Tag and release by hand (docs/RELEASING.md)."
            exit 1
          fi
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
      # The body is the version's section of CHANGELOG.md, as changesets/action
      # wrote it; a prerelease is marked as one.
      - name: Create the GitHub Release
        if: steps.tag.outputs.tag != ''
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then echo "The release $TAG exists already."; exit 0; fi
          awk -v heading="## $VERSION" '$0 == heading { p = 1; next } /^## / { if (p) exit } p' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md || { echo "::error title=No changelog entry::CHANGELOG.md has no section for $VERSION"; exit 1; }
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
      # The GitHub Action (action.yml) is used as brunoboto96/SceneScout@v3: a
      # major tag that follows the latest v3.x.y release, as actions/checkout's
      # v4 does. This points vX at the commit vX.Y.Z names. An exact tag
      # (@v3.10.0) or a commit SHA never moves, for users who pin.
      #
      # npm has already published by now, so this step never fails the job. The
      # tag rulesets keep exact release tags (refs/tags/v*.*.*) from being moved
      # and major tags (v3) from being deleted, so moving v3 is allowed. If a
      # setting ever refuses it, the refusal becomes a warning rather than a red
      # release.
      - name: Point the major tag at this release
        if: steps.tag.outputs.tag != ''
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          case "$VERSION" in *-*) echo "v$VERSION is a prerelease; the major tag stays where it is."; exit 0 ;; esac
          major="v${VERSION%%.*}"
          # Lightweight, so it needs no tagger identity, and git resolves it straight to the commit.
          git tag --force "$major" "v$VERSION^{commit}"
          if git ls-remote --exit-code --tags origin "refs/tags/$major" > /dev/null; then
            if git push --force origin "refs/tags/$major"; then echo "Moved $major to v$VERSION."; exit 0; fi
            what="move"
          else
            if git push origin "refs/tags/$major"; then echo "Created $major at v$VERSION."; exit 0; fi
            what="create"
          fi
          echo "::warning title=Major tag not updated::Could not $what $major at v$VERSION, so users of @$major do not get this release yet. Check that no tag ruleset restricts updating $major: only exact release tags (refs/tags/v*.*.*) should be protected against moves."

  # The GitHub Release above is made with this workflow's own token, and events
  # made with that token start no workflows, so guide-wiki's `release` trigger
  # does not fire for it. This dispatches it instead, for the release just
  # made. A separate job, so the permission to start workflows is never held by
  # a job that runs repository code.
  publish-guide:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Publish the guide to the wiki
        run: gh workflow run guide-wiki.yml --ref main -f ref="$TAG"
        env:
          TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # The desktop extension bundle (.mcpb) for the release just made, attached
  # to its GitHub Release so it can be downloaded and installed in Claude
  # Desktop. Built in a job that can write nothing, from the release tag (in a
  # rehearsal, from the commit), and checked against the MCPB manifest schema
  # with the pinned MCPB tool.
  desktop-extension:
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.release.outputs.ref != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run mcpb
      - name: Check the manifest against the MCPB schema
        run: npx -y @anthropic-ai/mcpb@2.1.2 validate .mcpb-build/stage/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-extension
          path: .mcpb-build/*.mcpb
          # .mcpb-build is a hidden directory, which the upload skips unless asked.
          include-hidden-files: true
          if-no-files-found: error

  # A separate job holds the permission to change the release, and runs no
  # repository code: it only uploads the file the job above built.
  attach-desktop-extension:
    needs: [release, desktop-extension]
    if: ${{ !cancelled() && needs.desktop-extension.result == 'success' && needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-extension
      - name: Write the bundle's checksum
        run: sha256sum *.mcpb > SHA256SUMS
      - name: Attach the bundle and its checksum to the release
        run: gh release upload "$TAG" *.mcpb SHA256SUMS --clobber
        env:
          TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # Signs a build provenance attestation for the bundle, so a downloaded .mcpb
  # can be checked with `gh attestation verify`. Its own job: it holds the
  # token-minting permission and runs no repository code. A rehearsal records
  # no attestation.
  attest-desktop-extension:
    needs: [release, desktop-extension]
    if: ${{ !cancelled() && needs.desktop-extension.result == 'success' && needs.release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-extension
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.mcpb"
