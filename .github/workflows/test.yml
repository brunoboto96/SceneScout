name: test

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow starts this on the "Version Packages" branch. GitHub
  # does not run pull_request workflows for a pull request opened with the
  # Actions token, so without this that pull request would never get the
  # required `test` check. Checks attach to the commit, so a run started this
  # way shows up on the pull request like any other.
  workflow_dispatch:

# Pushing again to a pull request makes the run already in flight pointless: it
# is testing a commit nobody will merge. Cancelling it frees the six matrix
# cells for the commit that replaced it.
#
# Only pull requests share a group. Every other run gets a group of its own,
# because a group does two things and only one of them is wanted here:
# `cancel-in-progress` governs the run already going, but a newly queued run
# ALSO cancels any run still pending in the group, whatever that setting says.
# Grouping pushes to main by ref would therefore serialise them, and a third
# merge arriving inside the suite's 20 minutes would cancel the second one's
# pending run. `test` is the required check and its job is `if: always()`, so it
# would report that cancellation as a failure on a main commit that was never
# actually tested. Keying on run_id instead leaves those runs alone. The same
# reasoning covers the dispatched run on the version branch, and a merge-queue
# run later on: a queue entry must always be allowed to report.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the suite only needs to read the code. A pull request from a
# fork must not be handed a token that can write to the repository.
permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # The supported floor and the current LTS, on the platform CI is cheapest on.
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 24 }
          # Where most contributors actually run it.
          - { os: macos-latest, node: 24 }
          # Windows runs everything too: path handling, the installer's symlink
          # fallback, and the engine driving a real Chromium.
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Formatting
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run format:check
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: All suites
        run: npm test
      # The committed sample report must be what the engine produces today. The
      # demo app bundles its font, so this holds across platforms; a difference
      # here means the engine's output changed and examples/ was not regenerated.
      - name: Sample report is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npx tsx scripts/demo.ts
          git diff --exit-code -- examples/report.md

  # The write policy is a promise about every browser the engine can drive, and
  # the browsers differ exactly where it matters: what the driver can intercept.
  # The browser suite therefore runs against the other two as well.
  cross-browser:
    name: ubuntu-latest · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Browser suite
        env:
          SCENESCOUT_BROWSER: ${{ matrix.browser }}
        run: npm run smoke

  # The GitHub Action at the repository root (action.yml), run the way a user
  # runs it, against the demo app, with the CLI built from this commit. The
  # demo's seeded defects that show at page load are all medium or low, so the
  # default gate must pass and `fail-on: medium` must fail. One OS: the action's
  # logic is table-tested in check-test on every OS already; this job proves the
  # YAML, the browser install and the exit-code handling on a real runner.
  #
  # SARIF is never uploaded here: the demo's defects would become this
  # repository's code-scanning alerts. The job's token cannot upload it anyway.
  check-action:
    name: ubuntu-latest · check action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the demo app
        run: |
          npm run demo:serve > "$RUNNER_TEMP/demo.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/; then exit 0; fi
            sleep 1
          done
          echo "The demo app did not answer on port 4173:"; cat "$RUNNER_TEMP/demo.log"; exit 1
      - name: Default gate (must pass)
        id: default
        uses: ./
        with:
          url: http://127.0.0.1:4173
          cli: dist/cli.js
          out: ${{ runner.temp }}/check-default
          upload-sarif: "false"
      - name: Stricter gate (must fail)
        id: strict
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:4173
          cli: dist/cli.js
          fail-on: medium
          out: ${{ runner.temp }}/check-medium
          # Uploads too: a second use in one job must get an artifact name of its own.
          upload-sarif: "false"
      - name: Each gate ended the way the demo's defects say it should
        env:
          DEFAULT_OUTCOME: ${{ steps.default.outcome }}
          DEFAULT_EXIT: ${{ steps.default.outputs.exit-code }}
          DEFAULT_PASSED: ${{ steps.default.outputs.passed }}
          DEFAULT_HIGH: ${{ steps.default.outputs.high }}
          DEFAULT_MEDIUM: ${{ steps.default.outputs.medium }}
          DEFAULT_REPORT: ${{ steps.default.outputs.report }}
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
          STRICT_EXIT: ${{ steps.strict.outputs.exit-code }}
          STRICT_PASSED: ${{ steps.strict.outputs.passed }}
          STRICT_FAILING: ${{ steps.strict.outputs.failing }}
          STRICT_JSON: ${{ runner.temp }}/check-medium/check.json
          DEFAULT_ARTIFACT: ${{ steps.default.outputs.artifact-name }}
          STRICT_ARTIFACT: ${{ steps.strict.outputs.artifact-name }}
        run: |
          set -x
          test "$DEFAULT_ARTIFACT" = scenescout-check-check-action
          test "$STRICT_ARTIFACT" = scenescout-check-check-action-2
          test "$DEFAULT_OUTCOME" = success
          test "$DEFAULT_EXIT" = 0
          test "$DEFAULT_PASSED" = true
          test "$DEFAULT_HIGH" = 0
          test "$DEFAULT_MEDIUM" -ge 1
          test -s "$DEFAULT_REPORT"
          test "$STRICT_OUTCOME" = failure
          # Read from the file as well as the outputs: a gate failure (1) must not be a could-not-run (2).
          node -e 'const j = require(process.argv[1]); if (j.gate.passed !== false || j.gate.failing < 1) process.exit(1)' "$STRICT_JSON"
          test "$STRICT_EXIT" = 1
          test "$STRICT_PASSED" = false
          test "$STRICT_FAILING" -ge 1

  # The ci action (ci/action.yml), end to end with no network: the demo app, a
  # stand-in for the model's API on this runner, and a dummy key from the job's
  # environment. The run must complete, write its files and never print the key.
  ci-action:
    name: ubuntu-latest · ci action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Not a secret: an invented value the stand-in API checks, so the job can look for it in the output.
      OPENAI_API_KEY: dummy-ci-action-key-0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start the demo app and the stand-in model API
        run: |
          npm run demo:serve > "$RUNNER_TEMP/demo.log" 2>&1 &
          EXPECTED_KEY="$OPENAI_API_KEY" node scripts/fake-model-api.mjs 4180 > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/ && curl -s -o /dev/null http://127.0.0.1:4180/; then exit 0; fi
            sleep 1
          done
          echo "The demo app or the stand-in API did not answer:"; cat "$RUNNER_TEMP/demo.log" "$RUNNER_TEMP/api.log"; exit 1
      - name: CI run through the action
        id: run
        uses: ./ci
        with:
          url: http://127.0.0.1:4173
          cli: dist/cli.js
          base-url: http://127.0.0.1:4180/v1
          max-minutes: "5"
          out: ${{ runner.temp }}/ci-run
          upload-sarif: "false"
      - name: The run completed, wrote its files and printed no key
        env:
          OUTCOME: ${{ steps.run.outcome }}
          EXIT: ${{ steps.run.outputs.exit-code }}
          STOP: ${{ steps.run.outputs.stop }}
          TURNS: ${{ steps.run.outputs.turns }}
          REPORT: ${{ steps.run.outputs.report }}
          SUMMARY: ${{ steps.run.outputs.summary }}
          SARIF: ${{ steps.run.outputs.sarif }}
          JSON: ${{ steps.run.outputs.json }}
          OUT: ${{ runner.temp }}/ci-run
        run: |
          set -x
          test "$OUTCOME" = success
          test "$EXIT" = 0
          test "$STOP" = done
          test "$TURNS" = 2
          test -s "$REPORT" && test -s "$SUMMARY" && test -s "$SARIF" && test -s "$JSON"
          # Read as JSON: require() loads a .sarif file as JavaScript.
          node -e 'const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (s.version !== "2.1.0" || !Array.isArray(s.runs)) process.exit(1)' "$SARIF"
          set +x # the lines below name the key; a trace would print it
          # The stand-in API quotes the key back in the model's last reply; it must be redacted everywhere it lands.
          if grep -rF "$OPENAI_API_KEY" "$OUT" "$GITHUB_STEP_SUMMARY"; then echo "the key was written"; exit 1; fi
          # The action's own log cannot be read back from here, so the same run is repeated with its output kept.
          mkdir -p "$RUNNER_TEMP/ci-cli"
          node dist/cli.js ci http://127.0.0.1:4173 --base-url http://127.0.0.1:4180/v1 --project "$RUNNER_TEMP/ci-cli" > "$RUNNER_TEMP/ci-cli.log" 2>&1
          grep -F "[redacted key]" "$RUNNER_TEMP/ci-cli.log"
          if grep -F "$OPENAI_API_KEY" "$RUNNER_TEMP/ci-cli.log"; then echo "the key was printed"; exit 1; fi
      # The same run split into two lanes. The stand-in API scripts each lane's
      # conversation on its own, and every lane files the same finding, which
      # the run must report once.
      - name: CI run through the action, in two lanes
        id: lanes
        uses: ./ci
        with:
          url: http://127.0.0.1:4173
          cli: dist/cli.js
          base-url: http://127.0.0.1:4180/v1
          max-minutes: "5"
          lanes: "2"
          project: ${{ runner.temp }}/ci-lanes-project
          out: ${{ runner.temp }}/ci-lanes
          upload-artifact: "false"
          upload-sarif: "false"
      - name: The two lanes ran, their shared finding was reported once, and no key was written
        env:
          OUTCOME: ${{ steps.lanes.outcome }}
          STOP: ${{ steps.lanes.outputs.stop }}
          TURNS: ${{ steps.lanes.outputs.turns }}
          LOW: ${{ steps.lanes.outputs.low }}
          JSON: ${{ steps.lanes.outputs.json }}
          OUT: ${{ runner.temp }}/ci-lanes
        run: |
          set -x
          test "$OUTCOME" = success
          test "$STOP" = done
          test "$TURNS" = 4
          test "$LOW" = 1
          node -e 'const j = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (j.lanes.ran !== 2) process.exit(1)' "$JSON"
          set +x # the line below names the key; a trace would print it
          if grep -rF "$OPENAI_API_KEY" "$OUT"; then echo "the key was written"; exit 1; fi

  # The branch ruleset requires ONE check, named "test". A matrix reports one
  # check per cell under changing names, so this job is the stable name that
  # summarises them: green only when every cell is. The action's job is part of
  # it: a broken action is a broken release, and the job runs alongside the
  # matrix, so it adds a few runner minutes and no wait.
  test:
    needs: [suite, cross-browser, check-action, ci-action]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every matrix cell passed
        run: |
          echo "suite result: ${{ needs.suite.result }}"
          echo "cross-browser result: ${{ needs.cross-browser.result }}"
          echo "check-action result: ${{ needs.check-action.result }}"
          echo "ci-action result: ${{ needs.ci-action.result }}"
          test "${{ needs.suite.result }}" = "success"
          test "${{ needs.cross-browser.result }}" = "success"
          test "${{ needs.check-action.result }}" = "success"
          test "${{ needs.ci-action.result }}" = "success"
