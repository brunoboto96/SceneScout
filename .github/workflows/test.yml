name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the suite only needs to read the code. A pull request from a
# fork must not be handed a token that can write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
