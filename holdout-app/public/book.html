<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book · Fernbrook Library</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <a class="name" href="/" data-testid="nav-name">Fernbrook Library</a>
      <nav aria-label="Main">
        <a href="/" data-testid="nav-home">Home</a>
        <a href="/catalogue.html" data-testid="nav-catalogue" aria-current="page">Catalogue</a>
        <a href="/loans.html" data-testid="nav-loans">Loans</a>
        <a href="/holds.html" data-testid="nav-holds">Holds</a>
        <a href="/checkout.html" data-testid="nav-checkout">Check out</a>
        <a href="/members.html" data-testid="nav-members">Members</a>
        <a href="/fines.html" data-testid="nav-fines">Fines</a>
        <a href="/events.html" data-testid="nav-events">Events</a>
        <a href="/account.html" data-testid="nav-account">Account</a>
      </nav>
      <a class="who" href="/signin.html" data-testid="nav-switch"><span id="who">member</span> · switch</a>
    </header>
    <main>
      <p><a href="/catalogue.html" data-testid="book-back">← Catalogue</a></p>
      <h1 id="title" data-testid="book-title">…</h1>
      <p class="intro" id="by" data-testid="book-by"></p>
      <div class="panel">
        <p id="shelf" data-testid="book-shelf"></p>
        <button class="go" id="hold" data-testid="book-hold">Place hold</button>
        <p class="status" id="hold-msg" role="status" data-testid="book-hold-msg"></p>
      </div>
      <h2>Reviews</h2>
      <ul class="reviews" id="reviews" data-testid="book-reviews"></ul>
      <form id="review-form" data-testid="book-review-form">
        <label for="review">Add a review</label>
        <textarea id="review" name="review" data-testid="book-review-text"></textarea>
        <div class="row"><button type="submit" data-testid="book-review-submit">Post review</button></div>
        <p class="status" id="review-msg" role="status" data-testid="book-review-msg"></p>
      </form>
    </main>
    <footer>Fernbrook Library loans desk · invented data only</footer>
    <script src="/app.js"></script>
    <script>
      const id = Number(new URLSearchParams(location.search).get("id"));
      let book = null;
      async function loadBook() {
        const res = await fetch("/api/books/" + id);
        if (!res.ok) {
          document.getElementById("title").textContent = "Book not found";
          document.getElementById("hold").hidden = true;
          document.getElementById("review-form").hidden = true;
          return;
        }
        book = await res.json();
        document.title = book.title + " · Fernbrook Library";
        document.getElementById("title").textContent = book.title;
        document.getElementById("by").textContent = book.author + ", " + book.year;
        document.getElementById("shelf").textContent =
          book.copies === 0
            ? "Withdrawn from the collection."
            : book.available > 0
              ? book.available + " of " + book.copies + " on the shelf."
              : "Every copy is out on loan.";
        document.getElementById("hold").hidden = book.copies === 0;
      }
      async function loadReviews() {
        const res = await fetch("/api/books/" + id + "/reviews");
        const list = res.ok ? await res.json() : [];
        document.getElementById("reviews").innerHTML = list.length
          ? list.map((r) => "<li><strong>" + fernbrook.esc(r.by) + ":</strong> " + r.text + "</li>").join("")
          : '<li class="muted">No reviews yet.</li>';
      }
      document.getElementById("hold").addEventListener("click", async () => {
        if (!book || book.available > 0) return;
        const msg = document.getElementById("hold-msg");
        const res = await fetch("/api/holds", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ book: book.id }),
        });
        const body = await res.json().catch(() => ({}));
        msg.textContent = res.ok ? "Hold placed. You are number " + body.position + " in the queue." : body.error || "The hold could not be placed.";
      });
      document.getElementById("review-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("review-msg");
        const text = document.getElementById("review").value;
        const res = await fetch("/api/books/" + id + "/reviews", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) {
          msg.textContent = body.error || "The review could not be posted.";
          return;
        }
        msg.textContent = "Thanks, your review is up.";
        document.getElementById("review").value = "";
        loadReviews();
      });
      loadBook();
      loadReviews();
    </script>
  </body>
</html>
