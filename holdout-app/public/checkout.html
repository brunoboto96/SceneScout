<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Check out · Fernbrook Library</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <a class="name" href="/" data-testid="nav-name">Fernbrook Library</a>
      <nav aria-label="Main">
        <a href="/" data-testid="nav-home">Home</a>
        <a href="/catalogue.html" data-testid="nav-catalogue">Catalogue</a>
        <a href="/loans.html" data-testid="nav-loans">Loans</a>
        <a href="/holds.html" data-testid="nav-holds">Holds</a>
        <a href="/checkout.html" data-testid="nav-checkout" aria-current="page">Check out</a>
        <a href="/members.html" data-testid="nav-members">Members</a>
        <a href="/fines.html" data-testid="nav-fines">Fines</a>
        <a href="/events.html" data-testid="nav-events">Events</a>
        <a href="/account.html" data-testid="nav-account">Account</a>
      </nav>
      <a class="who" href="/signin.html" data-testid="nav-switch"><span id="who">member</span> · switch</a>
    </header>
    <main>
      <h1>Check out a book</h1>
      <p class="intro">For the desk: lend a copy from the shelf to a member. Loans run for three weeks.</p>
      <form id="f" data-testid="checkout-form">
        <label for="member">Member card number</label>
        <input id="member" name="member" placeholder="M-1001" autocomplete="off" data-testid="checkout-member" />
        <label for="book">Book</label>
        <select id="book" name="book" data-testid="checkout-book"></select>
        <div class="row" style="margin-top: 18px">
          <button class="go" type="submit" data-testid="checkout-submit">Check out</button>
          <a class="button" href="/loans.html" data-testid="checkout-cancel">Cancel</a>
        </div>
        <p class="status" id="msg" role="status" data-testid="checkout-msg"></p>
      </form>
    </main>
    <footer>Fernbrook Library loans desk · invented data only</footer>
    <script src="/app.js"></script>
    <script>
      fetch("/api/books")
        .then((r) => r.json())
        .then((list) => {
          document.getElementById("book").innerHTML = list
            .filter((b) => b.copies > 0)
            .map((b) => '<option value="' + b.id + '">' + fernbrook.esc(b.title) + "</option>")
            .join("");
        });
      document.getElementById("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        const msg = document.getElementById("msg");
        const member = document.getElementById("member").value.trim();
        if (!member) {
          msg.textContent = "Enter the member's card number.";
          return;
        }
        const select = document.getElementById("book");
        const res = await fetch("/api/loans", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ member, book: Number(select.value) }),
        });
        if (res.status >= 500) {
          msg.textContent = "The desk could not reach the catalogue. Try again.";
          return;
        }
        const due = new Date(Date.now() + 21 * 86400000).toISOString().slice(0, 10);
        msg.textContent = "Checked out " + select.selectedOptions[0].textContent + " to " + member.toUpperCase() + ". Due back " + fernbrook.date(due) + ".";
      });
    </script>
  </body>
</html>
