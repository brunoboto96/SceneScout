<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fines · Fernbrook Library</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <a class="name" href="/" data-testid="nav-name">Fernbrook Library</a>
      <nav aria-label="Main">
        <a href="/" data-testid="nav-home">Home</a>
        <a href="/catalogue.html" data-testid="nav-catalogue">Catalogue</a>
        <a href="/loans.html" data-testid="nav-loans">Loans</a>
        <a href="/holds.html" data-testid="nav-holds">Holds</a>
        <a href="/checkout.html" data-testid="nav-checkout">Check out</a>
        <a href="/members.html" data-testid="nav-members">Members</a>
        <a href="/fines.html" data-testid="nav-fines" aria-current="page">Fines</a>
        <a href="/events.html" data-testid="nav-events">Events</a>
        <a href="/account.html" data-testid="nav-account">Account</a>
      </nav>
      <a class="who" href="/signin.html" data-testid="nav-switch"><span id="who">member</span> · switch</a>
    </header>
    <main>
      <h1>Fines</h1>
      <p class="intro">Members who owe the library. Over $5.00 and they cannot borrow until it is paid or waived.</p>
      <p class="muted" id="note" data-testid="fines-note"></p>
      <table>
        <thead>
          <tr>
            <th>Card</th>
            <th>Name</th>
            <th>Owes</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows" data-testid="fines-rows"></tbody>
      </table>
      <p class="error" id="err" role="alert" data-testid="fines-error" hidden></p>
    </main>
    <footer>Fernbrook Library loans desk · invented data only</footer>
    <script src="/app.js"></script>
    <script>
      let head = false;
      function show(message) {
        const err = document.getElementById("err");
        err.textContent = message;
        err.hidden = !message;
      }
      async function waive(id) {
        const res = await fetch("/api/fines/" + id + "/waive", { method: "POST" });
        if (!res.ok) return show((await res.json().catch(() => ({}))).error || "HTTP " + res.status);
        show("");
        load();
      }
      async function load() {
        const res = await fetch("/api/fines");
        const body = await res.json().catch(() => ({}));
        if (!res.ok) return show(body.error || "Could not load fines (HTTP " + res.status + ").");
        const rows = document.getElementById("rows");
        rows.replaceChildren();
        for (const m of body) {
          const tr = document.createElement("tr");
          tr.setAttribute("data-testid", "fines-row-" + m.id);
          tr.innerHTML = "<td>" + m.id + "</td><td>" + fernbrook.esc(m.name) + "</td><td>$" + m.fines.toFixed(2) + "</td><td></td>";
          if (head) {
            const b = document.createElement("button");
            b.textContent = "Waive";
            b.setAttribute("data-testid", "fines-waive-" + m.id);
            b.addEventListener("click", () => waive(m.id));
            tr.lastElementChild.appendChild(b);
          }
          rows.appendChild(tr);
        }
      }
      fernbrook.me
        .then((me) => {
          head = me.role === "head";
          document.getElementById("note").textContent = head ? "You can waive a fine." : "Only the branch head can waive a fine.";
        })
        .catch(() => {})
        .then(load);
    </script>
  </body>
</html>
