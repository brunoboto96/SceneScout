<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Holds · Fernbrook Library</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <a class="name" href="/" data-testid="nav-name">Fernbrook Library</a>
      <nav aria-label="Main">
        <a href="/" data-testid="nav-home">Home</a>
        <a href="/catalogue.html" data-testid="nav-catalogue">Catalogue</a>
        <a href="/loans.html" data-testid="nav-loans">Loans</a>
        <a href="/holds.html" data-testid="nav-holds" aria-current="page">Holds</a>
        <a href="/checkout.html" data-testid="nav-checkout">Check out</a>
        <a href="/members.html" data-testid="nav-members">Members</a>
        <a href="/fines.html" data-testid="nav-fines">Fines</a>
        <a href="/events.html" data-testid="nav-events">Events</a>
        <a href="/account.html" data-testid="nav-account">Account</a>
      </nav>
      <a class="who" href="/signin.html" data-testid="nav-switch"><span id="who">member</span> · switch</a>
    </header>
    <main>
      <h1>Holds</h1>
      <p class="intro">Books waiting to be collected or waiting for a copy to come back.</p>
      <table>
        <thead>
          <tr>
            <th>Book</th>
            <th>For</th>
            <th>Placed</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows" data-testid="holds-rows"></tbody>
      </table>
      <p class="muted" id="none" data-testid="holds-none" hidden>No holds.</p>
      <p class="error" id="err" role="alert" data-testid="holds-error" hidden></p>
    </main>
    <footer>Fernbrook Library loans desk · invented data only</footer>
    <script src="/app.js"></script>
    <script>
      const ICON =
        '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2" fill="none"/></svg>';
      async function drop(id) {
        const err = document.getElementById("err");
        const res = await fetch("/api/holds/" + id, { method: "DELETE" });
        if (!res.ok) {
          err.textContent = (await res.json().catch(() => ({}))).error || "HTTP " + res.status;
          err.hidden = false;
          return;
        }
        err.hidden = true;
        load();
      }
      async function load() {
        const res = await fetch("/api/holds");
        const list = res.ok ? await res.json() : [];
        const rows = document.getElementById("rows");
        rows.innerHTML = list
          .map(
            (h) =>
              '<tr data-testid="holds-row-' +
              h.id +
              '"><td>' +
              fernbrook.esc(h.title) +
              "</td><td>" +
              fernbrook.esc(h.name) +
              "</td><td>" +
              fernbrook.date(h.placed) +
              '</td><td><button class="icon" data-hold="' +
              h.id +
              '" data-testid="holds-drop-' +
              h.id +
              '">' +
              ICON +
              "</button></td></tr>",
          )
          .join("");
        for (const b of rows.querySelectorAll("button[data-hold]")) b.addEventListener("click", () => drop(b.dataset.hold));
        document.getElementById("none").hidden = list.length > 0;
      }
      load();
    </script>
  </body>
</html>
