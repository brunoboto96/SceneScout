<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loans · Fernbrook Library</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <a class="name" href="/" data-testid="nav-name">Fernbrook Library</a>
      <nav aria-label="Main">
        <a href="/" data-testid="nav-home">Home</a>
        <a href="/catalogue.html" data-testid="nav-catalogue">Catalogue</a>
        <a href="/loans.html" data-testid="nav-loans" aria-current="page">Loans</a>
        <a href="/holds.html" data-testid="nav-holds">Holds</a>
        <a href="/checkout.html" data-testid="nav-checkout">Check out</a>
        <a href="/members.html" data-testid="nav-members">Members</a>
        <a href="/fines.html" data-testid="nav-fines">Fines</a>
        <a href="/events.html" data-testid="nav-events">Events</a>
        <a href="/account.html" data-testid="nav-account">Account</a>
      </nav>
      <a class="who" href="/signin.html" data-testid="nav-switch"><span id="who">member</span> · switch</a>
    </header>
    <main>
      <h1>Loans</h1>
      <p class="intro" id="loans-intro">Books out right now. Each loan can be renewed twice, two weeks at a time.</p>
      <table>
        <thead>
          <tr>
            <th>Book</th>
            <th>Borrower</th>
            <th>Due</th>
            <th>Renewed</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows" data-testid="loans-rows"></tbody>
      </table>
      <p class="muted" id="none" data-testid="loans-none" hidden>Nothing is on loan.</p>
      <p class="error" id="err" role="alert" data-testid="loans-error" hidden></p>
    </main>
    <footer>Fernbrook Library loans desk · invented data only</footer>
    <script src="/app.js"></script>
    <script>
      let staff = false;
      function show(message) {
        const err = document.getElementById("err");
        err.textContent = message;
        err.hidden = !message;
      }
      async function act(loan, action) {
        const res = await fetch("/api/loans/" + loan + "/" + action, { method: "POST" });
        if (!res.ok) {
          show((await res.json().catch(() => ({}))).error || "HTTP " + res.status);
          return;
        }
        show("");
        load();
      }
      async function load() {
        const res = await fetch("/api/loans");
        if (!res.ok) return show("Could not load loans (HTTP " + res.status + ").");
        const list = await res.json();
        const today = fernbrook.today();
        const rows = document.getElementById("rows");
        rows.replaceChildren();
        for (const l of list) {
          const tr = document.createElement("tr");
          tr.setAttribute("data-testid", "loans-row-" + l.id);
          const late = l.due < today;
          tr.innerHTML =
            '<td><a href="/book.html?id=' +
            l.book +
            '">' +
            fernbrook.esc(l.title) +
            "</a></td><td>" +
            fernbrook.esc(l.name) +
            "</td><td>" +
            fernbrook.date(l.due) +
            (late ? ' <span class="tag late">overdue</span>' : "") +
            "</td><td>" +
            l.renewals +
            " of 2</td><td></td>";
          const cell = tr.lastElementChild;
          const renew = document.createElement("button");
          renew.textContent = "Renew";
          renew.setAttribute("data-testid", "loans-renew-" + l.id);
          renew.addEventListener("click", () => act(l.id, "renew"));
          cell.appendChild(renew);
          if (staff) {
            const back = document.createElement("button");
            back.textContent = "Return";
            back.style.marginLeft = "6px";
            back.setAttribute("data-testid", "loans-return-" + l.id);
            back.addEventListener("click", () => act(l.id, "return"));
            cell.appendChild(back);
          }
          rows.appendChild(tr);
        }
        document.getElementById("none").hidden = list.length > 0;
      }
      fernbrook.me
        .then((me) => {
          staff = me.role !== "member";
          if (!staff) document.getElementById("loans-intro").textContent = "Books you have out. Each loan can be renewed twice, two weeks at a time.";
        })
        .catch(() => {})
        .then(load);
    </script>
  </body>
</html>
