<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Fernbrook Library</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <a class="name" href="/" data-testid="nav-name">Fernbrook Library</a>
      <nav aria-label="Main">
        <a href="/" data-testid="nav-home">Home</a>
        <a href="/catalogue.html" data-testid="nav-catalogue">Catalogue</a>
        <a href="/loans.html" data-testid="nav-loans">Loans</a>
        <a href="/holds.html" data-testid="nav-holds">Holds</a>
        <a href="/checkout.html" data-testid="nav-checkout">Check out</a>
        <a href="/members.html" data-testid="nav-members">Members</a>
        <a href="/fines.html" data-testid="nav-fines">Fines</a>
        <a href="/events.html" data-testid="nav-events">Events</a>
        <a href="/account.html" data-testid="nav-account">Account</a>
      </nav>
      <a class="who" href="/signin.html" data-testid="nav-switch"><span id="who">member</span> · switch</a>
    </header>
    <main>
      <h1>Who is using the desk?</h1>
      <p class="intro">Pick a role to see the library the way that person does.</p>
      <div class="tiles">
        <button class="panel tile pick" data-role="member" data-testid="signin-member">
          <span class="n">Member</span><span class="l">Borrows, renews and places holds.</span>
        </button>
        <button class="panel tile pick" data-role="librarian" data-testid="signin-librarian">
          <span class="n">Librarian</span><span class="l">Checks books in and out, sees every member.</span>
        </button>
        <button class="panel tile pick" data-role="head" data-testid="signin-head">
          <span class="n">Branch head</span><span class="l">Everything a librarian does, and can waive fines.</span>
        </button>
      </div>
      <p class="status error" id="signin-error" role="alert" data-testid="signin-error"></p>
    </main>
    <footer>Fernbrook Library loans desk · invented data only</footer>
    <script src="/app.js"></script>
    <script>
      for (const b of document.querySelectorAll("button.pick")) {
        b.addEventListener("click", async () => {
          const res = await fetch("/api/signin", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ role: b.dataset.role }),
          }).catch(() => null);
          if (!res || !res.ok) {
            document.getElementById("signin-error").textContent = "Could not switch role. Try again.";
            return;
          }
          location.href = "/";
        });
      }
    </script>
  </body>
</html>
