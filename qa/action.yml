# The two keyless stages of a QA review started by a `/scenescout qa` comment on
# a pull request. The run itself is the ci action (ci/action.yml), in a job of
# its own that holds the model's key; this action never sees that key, never
# checks out the repository and never runs the pull request's code. The
# workflow it belongs in, and what a project configures: docs/ci.md. Why it is
# shaped this way: docs/adr/0015-a-qa-comment-tests-a-preview-and-never-runs-the-pull-requests-code.md.
#
#   stage: gate    read the comment, check who wrote it and where the pull
#                  request comes from, find the preview's URL, react, and set
#                  run=true only when every check passes
#   stage: shots   put a show or compare run's pictures on the scenescout-shots
#                  branch, under the run's id, so the reply can show them
#   stage: report  download the run's results and post them on the pull request
#   stage: check   for `/scenescout qa check`: dispatch the project's own
#                  workflow on the pull request's branch, wait for its run,
#                  download its artifact and reply with check.json's verdict.
#                  No model and no key are involved.
#
# The logic is action/qa-action.mjs and action/qa-check.mjs, table-tested by qa-test.
name: SceneScout QA
description: Start a SceneScout QA run from a pull-request comment and post its results, without ever running the pull request's code.
author: brunoboto96
branding:
  icon: message-square
  color: blue

inputs:
  stage:
    description: gate, shots, report or check.
    required: true
  github-token:
    description: The token for the GitHub API. The gate needs pull-requests write and deployments read; the shots stage needs contents write, to push to the scenescout-shots branch; the report needs pull-requests write and actions read (to link the artifact, and to tell a run a newer one cancelled from one cancelled by hand or a timeout); the check stage needs actions write (to dispatch the project's workflow, which also lets it read that run and download its artifact) and pull-requests write (to reply).
    required: false
    default: ${{ github.token }}
  allowed:
    description: (gate) The GitHub logins that may start a run, separated by commas or spaces. With allowed-roles and allowed-teams, a union; all three empty means the repository's owners only.
    required: false
    default: ""
  allowed-roles:
    description: (gate) Comment author associations that may start a run - OWNER, MEMBER, COLLABORATOR - separated by commas or spaces. Any other value fails the gate.
    required: false
    default: ""
  allowed-teams:
    description: (gate) Teams of the repository's organization whose active members may start a run, as org/team-slug, separated by commas or spaces. Needs team-token; a team of another organization allows no one.
    required: false
    default: ""
  team-token:
    description: (gate) A token that can read the organization's team membership (a GitHub App token, or a personal access token with read:org), used only for allowed-teams. Empty means no one is allowed by team. Pass it to the gate only.
    required: false
    default: ""
  allow-forks:
    description: (gate) true to run on pull requests from forks. Empty means forks are refused, with a reply that says why.
    required: false
    default: ""
  preview-url:
    description: (gate) A template for the pull request's preview URL, with {pr} and {sha} filled in, e.g. https://pr-{pr}.preview.example.com. Empty means the newest successful deployment of the head commit, unless the comment gives a URL.
    required: false
    default: ""
  environment:
    description: (gate) Only deployments to this environment count as the preview. Empty means any.
    required: false
    default: ""
  base-url:
    description: (gate) What `/scenescout qa compare` compares the preview with, e.g. https://www.example.com. Empty means the newest successful deployment of the pull request's base branch.
    required: false
    default: ""
  check-workflow:
    description: (gate, check) The project's workflow that `/scenescout qa check` dispatches, by its file name in .github/workflows (e.g. browser-tests.yml) or its id. In the gate, empty means the command replies saying how to set it up; the check stage takes the gate's check-workflow output.
    required: false
    default: ""
  ref:
    description: (check) The pull request's head branch to dispatch the workflow on, from the gate.
    required: false
    default: ""
  focus:
    description: (check) The words after `/scenescout qa check`, from the gate, passed to the workflow as its focus input.
    required: false
    default: ""
  wait-minutes:
    description: (check) How long to wait for the dispatched run, in minutes, 1 to 300. Empty means 30. Keep the job's timeout-minutes above it.
    required: false
    default: ""
  result:
    description: (report) The result of the job that ran the model - success, failure, cancelled or skipped.
    required: false
    default: ""
  artifact-name:
    description: (shots, report, check) The name the run's results were uploaded under. In the check stage, the artifact the project's workflow uploads its check's output folder as; empty means scenescout-check.
    required: false
    default: ""
  pr:
    description: (report, check) The pull request's number, from the gate.
    required: false
    default: ""
  sha:
    description: (report, check) The head commit the gate saw.
    required: false
    default: ""
  url:
    description: (report) The preview URL the run tested.
    required: false
    default: ""
  login:
    description: (report, check) Who asked for the run.
    required: false
    default: ""
  shots:
    description: (report) The pictures the shots stage pushed, from its pushed output. Only these are shown.
    required: false
    default: ""

outputs:
  run:
    description: (gate) true when the comment starts a run.
    value: ${{ steps.gate.outputs.run }}
  pr:
    description: (gate) The pull request's number.
    value: ${{ steps.gate.outputs.pr }}
  sha:
    description: (gate) The pull request's head commit.
    value: ${{ steps.gate.outputs.sha }}
  url:
    description: (gate) The preview URL to test.
    value: ${{ steps.gate.outputs.url }}
  focus:
    description: (gate) The focus the comment gave, if any.
    value: ${{ steps.gate.outputs.focus }}
  login:
    description: (gate) Who asked for the run.
    value: ${{ steps.gate.outputs.login }}
  show:
    description: (gate) The element a show or compare comment asked for; empty for an ordinary run.
    value: ${{ steps.gate.outputs.show }}
  base:
    description: (gate) The base URL a compare comment compares with; empty otherwise.
    value: ${{ steps.gate.outputs.base }}
  check:
    description: (gate) true when the comment is `/scenescout qa check` and the project's workflow may be dispatched. run stays false then, since no model runs.
    value: ${{ steps.gate.outputs.check }}
  ref:
    description: (gate) The pull request's head branch, for a check.
    value: ${{ steps.gate.outputs.ref }}
  check-workflow:
    description: (gate) The workflow a check dispatches, as the gate checked it.
    value: ${{ steps.gate.outputs.check-workflow }}
  pushed:
    description: (shots) The pictures pushed, separated by commas.
    value: ${{ steps.shots.outputs.pushed }}

runs:
  using: composite
  steps:
    - name: Look for Node.js 20 or newer
      id: node
      shell: bash
      run: |
        if command -v node >/dev/null && [ "$(node -p 'process.versions.node.split(".")[0]')" -ge 20 ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install Node.js
      if: steps.node.outputs.present != 'true'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"

    - name: Decide whether this comment starts a run
      id: gate
      if: inputs.stage == 'gate'
      shell: bash
      env:
        INPUTS: ${{ toJSON(inputs) }}
      run: node "$GITHUB_ACTION_PATH/../action/qa-action.mjs" gate

    - name: Download the run's pictures
      if: inputs.stage == 'shots' && inputs.artifact-name != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/scenescout-qa-shots

    - name: Put the pictures on the image branch
      id: shots
      if: inputs.stage == 'shots'
      shell: bash
      env:
        INPUTS: ${{ toJSON(inputs) }}
        RESULTS: ${{ runner.temp }}/scenescout-qa-shots
      run: node "$GITHUB_ACTION_PATH/../action/qa-action.mjs" shots

    - name: Download the run's results
      if: inputs.stage == 'report' && inputs.result != 'cancelled' && inputs.artifact-name != ''
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/scenescout-qa-results

    - name: Post the results on the pull request
      if: inputs.stage == 'report'
      shell: bash
      env:
        INPUTS: ${{ toJSON(inputs) }}
        RESULTS: ${{ runner.temp }}/scenescout-qa-results
      run: node "$GITHUB_ACTION_PATH/../action/qa-action.mjs" report

    - name: Dispatch the project's check and wait for its run
      id: dispatch
      if: inputs.stage == 'check'
      shell: bash
      env:
        INPUTS: ${{ toJSON(inputs) }}
      run: node "$GITHUB_ACTION_PATH/../action/qa-check.mjs" dispatch

    - name: Download the check's results
      id: download
      if: inputs.stage == 'check' && steps.dispatch.outputs.download == 'true'
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ steps.dispatch.outputs.artifact }}
        run-id: ${{ steps.dispatch.outputs.run-id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ runner.temp }}/scenescout-qa-check

    - name: Post the check's verdict on the pull request
      if: inputs.stage == 'check' && steps.dispatch.outputs.download == 'true'
      shell: bash
      env:
        INPUTS: ${{ toJSON(inputs) }}
        DISPATCH: ${{ toJSON(steps.dispatch.outputs) }}
        # failure when the download failed: the reply says so rather than blame the project's check.json.
        DOWNLOAD: ${{ steps.download.outcome }}
        RESULTS: ${{ runner.temp }}/scenescout-qa-check
      run: node "$GITHUB_ACTION_PATH/../action/qa-check.mjs" reply

    - name: Unknown stage
      if: inputs.stage != 'gate' && inputs.stage != 'shots' && inputs.stage != 'report' && inputs.stage != 'check'
      shell: bash
      run: |
        echo "::error title=SceneScout QA::the stage input must be gate, shots, report or check"
        exit 2
