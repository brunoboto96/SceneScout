<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Account login</title></head>
<body>
  <h1>Account login</h1>
  <!-- The same embed on a sign-in page and on a checkout page: a captcha on the
       first must be able to post to its own site, a payment box on the second
       must not. Only the page's path differs. -->
  <iframe id="embed" title="Embedded check" width="300" height="120"></iframe>
  <script>
    // Only a loopback origin, the fixture server's second port; anything else is ignored.
    const raw = new URLSearchParams(location.search).get('foreign') || '';
    const other = /^http:\/\/127\.0\.0\.1:\d{2,5}$/.test(raw) ? raw : '';
    if (other) document.getElementById('embed').src = other + '/frame-child.html?as=login';
  </script>
</body>
</html>
