<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Check: a value from the environment</title></head>
<body>
  <!-- For `scenescout check`'s ${env:NAME} values. A GET form puts whatever is typed into the address, which a failed
       flow step reports, so a value taken from the environment would leak there unless the check masks it. -->
  <h1>Search</h1>
  <form method="get" action="/check-flow-search.html">
    <label>Query <input data-testid="search-query" name="q" type="text"></label>
    <button type="submit" data-testid="search-go">Search</button>
  </form>
  <p data-testid="search-status" role="status">No results</p>
</body>
</html>
