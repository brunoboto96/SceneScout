<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Widgets</title>
  </head>
  <body>
    <!--
      Fixture defects: this page hides two refusals from the user.

      "Load widgets" fetches a list, gets a 403, and renders the table's empty
      state anyway — so the screen says the user has no widgets when the truth
      is that the server would not say. "Save" posts, gets a 500, and puts up
      an affirmation — so the user walks away believing their change was kept.

      "Change owner" sends a PUT to a record this session did not create, which
      the write policy refuses outside destructive mode, and the page puts up
      an affirmation without reading the answer. That the refusal came from the
      tester rather than the server changes nothing about the page's defect.

      Neither is a crash, and both look correct on screen. That is the whole
      point: they are exactly what a run that only watches for errors misses.
      The page deliberately says nothing anywhere about anything going wrong.
    -->
    <h1>Widgets</h1>

    <button data-testid="widgets-load-button" onclick="loadWidgets()">Load widgets</button>
    <button data-testid="widgets-save-button" onclick="saveWidget()">Save</button>
    <button data-testid="widgets-owner-button" onclick="changeOwner()">Change owner</button>
    <button data-testid="widgets-update-button" onclick="updateWidget()">Update widget</button>

    <table data-testid="widgets-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Owner</th>
        </tr>
      </thead>
      <tbody data-testid="widgets-rows"></tbody>
    </table>
    <p data-testid="widgets-status"></p>
    <!-- Refusal-shaped help text, as a danger zone or a form carries. It must
         not excuse the lies above: it is not the page answering anything. -->
    <p class="help">This cannot be undone. Only admins can invite members.</p>

    <script>
      async function loadWidgets() {
        const res = await fetch("/api/refuse/403");
        // The response is never looked at. This is the bug, and it is what the
        // code in front of a great many real empty states actually does.
        const rows = await res.json().catch(() => ({ items: [] }));
        const body = document.querySelector("[data-testid=widgets-rows]");
        body.innerHTML = "";
        for (const row of rows.items ?? []) {
          const tr = document.createElement("tr");
          tr.textContent = row.name;
          body.appendChild(tr);
        }
        document.querySelector("[data-testid=widgets-status]").textContent = "No widgets found";
      }

      async function saveWidget() {
        await fetch("/api/refuse/500", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name: "w1" }),
        }).catch(() => {});
        document.querySelector("[data-testid=widgets-status]").textContent = "Saved successfully";
      }

      // No .catch at all: under the old policy the dropped PUT threw here and
      // the success line never ran, which is how the policy hid this defect.
      // The read after it is refused by the SERVER, inside the same action.
      async function updateWidget() {
        await fetch("/api/widgets/7", {
          method: "PUT",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name: "w7" }),
        });
        await fetch("/api/refuse/403?after=update");
        document.querySelector("[data-testid=widgets-status]").textContent = "Widget updated";
      }

      async function changeOwner() {
        await fetch("/api/widgets/9", {
          method: "PUT",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ owner: "someone else" }),
        }).catch(() => {});
        document.querySelector("[data-testid=widgets-status]").textContent = "Owner updated";
      }
    </script>
  </body>
</html>
