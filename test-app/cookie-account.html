<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Your account</title>
  </head>
  <body>
    <!--
      Served at /cookie-account to a browser carrying the sign-in cookie that
      /cookie-signin sets. cookie-account-signed-out.html is its pair: the same
      URL and the same layout, served when the cookie is absent, so the one
      fact that differs between the two is whether the browser is signed in.
    -->
    <main>
      <h1 data-testid="account-heading">Signed in as a member</h1>
      <p data-testid="account-state">Your session is active.</p>
      <a data-testid="account-orders-link" href="/cookie-account">Your orders</a>
    </main>
  </body>
</html>
