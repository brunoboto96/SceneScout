<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Design score calibration</title>
  <style>
    body { margin: 0; padding: 32px; font: 16px/1.5 sans-serif; background: rgb(249, 250, 251); color: rgb(23, 23, 23); }
    h1 { margin: 0 0 16px; font-size: 28px; line-height: 36px; }
    h2 { margin: 0 0 8px; font-size: 20px; line-height: 28px; }
    p { margin: 0 0 8px; }
    .stack { display: flex; flex-direction: column; gap: 8px; max-width: 640px; margin-bottom: 24px; }
    .card { padding: 16px; background: rgb(255, 255, 255); border: 1px solid rgb(209, 213, 219); border-radius: 8px; }
    .actions { display: flex; gap: 12px; margin-bottom: 24px; }
    .actions button { height: 36px; padding: 0 16px; border-radius: 6px; font: inherit; border: 1px solid rgb(30, 64, 175); background: rgb(255, 255, 255); color: rgb(30, 64, 175); }
    .actions button.primary { background: rgb(30, 64, 175); color: rgb(255, 255, 255); }
    .notes p { color: rgb(64, 64, 64); }
    .notes p.quiet { color: rgb(82, 82, 82); }
    /* A joined list group: items share their borders, square where they meet, rounded only at the group's outer corners. */
    .group { list-style: none; margin: 0 0 24px; padding: 0; max-width: 640px; }
    .group li { padding: 12px 16px; background: rgb(255, 255, 255); border: 1px solid rgb(209, 213, 219); }
    .group li + li { border-top: 0; }
    .group li:first-child { border-radius: 8px 8px 0 0; }
    .group li:last-child { border-radius: 0 0 8px 8px; }
    /* The one fact each variant changes. */
    .touching .stack { gap: 0; }
  </style>
</head>
<body>
  <!-- One page, and each defect the design score is calibrated on is one class
       away: ?with=touching drops the gap between the stacked cards,
       ?with=heights gives the six buttons six heights, ?with=grays writes the
       notes in twelve grays. ?with=touching,heights,grays is all three. The
       list group is joined on purpose in every variant and is never touching. -->
  <main>
    <h1>Account settings</h1>
    <div class="actions" data-testid="score-actions">
      <button class="primary">Save changes</button>
      <button>Preview</button>
      <button>Export</button>
      <button>Duplicate</button>
      <button>Archive</button>
      <button>Share</button>
    </div>
    <div class="stack" data-testid="score-profile-stack">
      <section class="card"><h2>Profile</h2><p>Your name and photo.</p></section>
      <section class="card"><h2>Password</h2><p>Change how you sign in.</p></section>
    </div>
    <div class="stack" data-testid="score-billing-stack">
      <section class="card"><h2>Billing</h2><p>Your plan and invoices.</p></section>
      <section class="card"><h2>Notifications</h2><p>What we tell you about.</p></section>
    </div>
    <ul class="group" data-testid="score-list-group">
      <li>Sessions</li>
      <li>Devices</li>
      <li>Connected apps</li>
    </ul>
    <div class="notes" data-testid="score-notes">
      <p>Changes apply to every workspace you belong to.</p>
      <p class="quiet">Last saved a moment ago.</p>
    </div>
  </main>
  <script>
    const wanted = (new URLSearchParams(location.search).get("with") || "").split(",");
    if (wanted.includes("touching")) document.body.classList.add("touching");
    if (wanted.includes("heights")) {
      document.querySelectorAll(".actions button").forEach((b, i) => { b.style.height = 28 + i * 4 + "px"; });
    }
    if (wanted.includes("grays")) {
      const notes = document.querySelector(".notes");
      for (let i = 0; i < 12; i++) {
        const p = document.createElement("p");
        const v = 30 + i * 5;
        p.style.color = "rgb(" + v + ", " + v + ", " + v + ")";
        p.textContent = "Note " + (i + 1) + " about this account.";
        notes.appendChild(p);
      }
    }
  </script>
</body>
</html>
