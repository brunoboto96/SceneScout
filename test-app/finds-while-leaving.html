<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Finding while it leaves</title>
  </head>
  <body>
    <main>
      <h1>Finding while leaving</h1>
      <label>Note <input type="text" name="note" /></label>
      <button type="button" id="show">Show</button>
      <div id="out"></div>
    </main>
    <script>
      // Renders the note as markup. The first time the injection scan finds it there, the page has its service worker
      // move it on to an address the fixture server holds back (held=1), and answers the scan only once a request of
      // its own, also held, is let through: a scan read that completes after the action gave it up, with the page on
      // its way elsewhere.
      if (navigator.serviceWorker) navigator.serviceWorker.register("/navigate-sw.js");
      document.getElementById("show").onclick = () => {
        document.getElementById("out").innerHTML = document.querySelector("input").value;
      };
      const all = Document.prototype.querySelectorAll;
      let left = false;
      document.querySelectorAll = function (selector) {
        const found = all.call(document, selector);
        if (!left && selector === 'marquee[data-probe="1"]' && found.length > 0 && navigator.serviceWorker?.controller) {
          left = true;
          navigator.serviceWorker.controller.postMessage({ to: "/page2.html?held=1" });
          const busy = new XMLHttpRequest();
          busy.open("GET", "/covered.html?held=1", false);
          busy.send();
        }
        return found;
      };
    </script>
  </body>
</html>
