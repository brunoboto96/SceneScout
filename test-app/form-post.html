<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Add a thing</title>
  </head>
  <body>
    <main>
      <h1>Add a thing</h1>
      <!-- A native form posting a create: the page it lands on is reached by a POST, so its history entry is one. -->
      <form method="post" action="/form-landing">
        <label>Title <input name="title" value="a thing" data-testid="form-post-title" /></label>
        <button type="submit" data-testid="form-post-submit">Add thing</button>
      </form>
      <!-- The same form, posting to an address the server answers only to POST (a GET of it is refused with 405). -->
      <form method="post" action="/form-landing-post-only">
        <input type="hidden" name="title" value="another thing" />
        <button type="submit" data-testid="form-post-only-submit">Add thing by POST only</button>
      </form>
      <!-- A form posting to an address that reads as a command (/things/9/cancel): a GET of it is one a server may act on. -->
      <form method="post" action="/things/9/cancel">
        <input type="hidden" name="reason" value="smoke" />
        <button type="submit" data-testid="form-post-command-submit">Cancel thing 9</button>
      </form>
    </main>
  </body>
</html>
