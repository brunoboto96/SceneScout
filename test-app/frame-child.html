<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Embedded form</title></head>
<body>
  <form id="f">
    <input name="note" aria-label="Note" data-testid="frame-note-input">
    <button type="button" id="send" data-testid="frame-send-action">Send</button>
  </form>
  <script>
    // Posts to this frame's own origin, the way an embedded form posts to the site that serves it.
    window.sendNote = () =>
      fetch('/api/frame-note-' + new URLSearchParams(location.search).get('as'), { method: 'POST', body: 'note' })
        .then((r) => r.status)
        .catch(() => 'failed');
    document.getElementById('send').addEventListener('click', window.sendNote);
    // A form aimed at the top window: the browser reports its request against
    // the top page, not this frame, and only the Origin header still names
    // this frame's site. Posts to this frame's own origin.
    const topForm = document.createElement('form');
    topForm.method = 'post';
    topForm.target = '_top';
    topForm.action = '/api/frame-top-' + new URLSearchParams(location.search).get('as');
    document.body.appendChild(topForm);
    window.postToTop = () => topForm.submit();
    // A popup on this frame's own site, which posts as it loads.
    window.openPopup = () => { window.open(location.origin + '/frame-popup.html?via=open'); };
    // Two ways a patched window.open does not reach: a detached link's click,
    // and window.open borrowed from a blank child frame.
    window.openPopupLink = () => {
      const a = document.createElement('a');
      a.href = location.origin + '/frame-popup.html?via=link';
      a.target = '_blank';
      a.click();
    };
    window.openPopupBorrowed = () => {
      const blank = document.createElement('iframe');
      document.body.appendChild(blank);
      blank.contentWindow.open(location.origin + '/frame-popup.html?via=borrowed');
    };
    // Move the whole window to this frame's own site by way of a data: URL loaded in this frame's place.
    window.moveTop = () => {
      const target = location.origin + '/frame-popup.html?via=top';
      location.href = 'data:text/html,' + encodeURIComponent('<script>top.location = ' + JSON.stringify(target) + ';<\/script>');
    };
    // Load a data: URL in this frame's place that posts to this frame's site with "Origin: null".
    window.dataFetch = () => {
      const target = location.origin + '/api/frame-datafetch';
      location.href = 'data:text/html,' + encodeURIComponent('<script>fetch(' + JSON.stringify(target) + ', { method: "POST", body: "x", mode: "no-cors" });<\/script>');
    };
    // A write into the app itself, the way a sign-in frame posts its reply to the app's callback.
    window.sendToApp = (app) =>
      fetch(app + '/api/frame-to-app', { method: 'POST', body: 'reply', mode: 'no-cors' })
        .then(() => 'sent')
        .catch(() => 'failed');
  </script>
</body>
</html>
