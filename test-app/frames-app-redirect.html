<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>App frame that redirects out</title></head>
<body>
  <h1>A frame of the app's own that redirects to another site</h1>
  <iframe id="embed" title="App-hosted embed" width="400" height="200"></iframe>
  <script>
    // Only a loopback origin, the fixture server's second port; anything else is ignored.
    const raw = new URLSearchParams(location.search).get('foreign') || '';
    const port = /^http:\/\/127\.0\.0\.1:(\d{2,5})$/.exec(raw);
    // Rebuilt from a number on a fixed host, so nothing of the query string itself reaches the page.
    const other = port ? 'http://127.0.0.1:' + Number(port[1]) : '';
    const hops = new URLSearchParams(location.search).get('hops');
    if (other && hops === 'code') document.getElementById('embed').src = other + '/idp-renew?to=' + encodeURIComponent(location.origin);
    else if (other) document.getElementById('embed').src = (hops === '2' ? '/app-frame-redirect2?to=' : '/app-frame-redirect?to=') + encodeURIComponent(other);
  </script>
</body>
</html>
