<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Embed behind a redirect</title></head>
<body>
  <h1>An embed that redirects before it loads</h1>
  <iframe id="embed" title="Redirected embed" width="400" height="200"></iframe>
  <a id="no-content" href="/no-content" data-testid="frames-no-content-link">Nothing happens</a>
  <script>
    // Only a loopback origin, the fixture server's second port; anything else is ignored.
    const raw = new URLSearchParams(location.search).get('foreign') || '';
    const other = /^http:\/\/127\.0\.0\.1:\d{2,5}$/.test(raw) ? raw : '';
    if (other) document.getElementById('embed').src = other + '/frame-redirect';
  </script>
</body>
</html>
