<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gated area (guard a moment after load)</title>
  </head>
  <body>
    <main>
      <h1 data-testid="gated-late-heading">Gated area</h1>
    </main>
    <script>
      // A client-side auth guard that sends a signed-out visitor to sign-in 600 ms after the page has loaded, as an app
      // does that first finishes a token check. No request is in flight while it waits, so the engine's request-based
      // settle has nothing to wait on. Signed in (the "smoke-auth" flag a storage state sets), the same page stays put:
      // that is the one fact the crawl's sign-in check must turn on. The delay sits past the time a crawl takes to read a
      // route without watching its address (a guard up to about 0.4 s after load lands while the route's controls are
      // collected), and inside the watch (caught up to about 0.8 s), so the check fails without the watch.
      // gated-late.html is the attach's.
      addEventListener("load", function () {
        setTimeout(function () {
          try {
            if (localStorage.getItem("smoke-auth") === "yes") return;
          } catch (e) {
            /* storage unavailable — treat as signed out */
          }
          location.replace("/login?redirectTo=" + encodeURIComponent(location.pathname));
        }, 600);
      });
    </script>
  </body>
</html>
