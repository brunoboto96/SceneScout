<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Framed modal (closed)</title>
  <style>
    body { font-family: system-ui, sans-serif; color: #111111; background: #ffffff; margin: 0; padding: 16px; overflow: hidden; }
    .tall { min-height: 2400px; }
    .frame-host { position: fixed; inset: 0; background: transparent; z-index: 100; }
    .frame-host iframe { width: 100%; height: 100%; border: 0; background: transparent; }
  </style>
</head>
<body>
  <!-- The other half of the pair in iframe-modal.html: the same page, the same
       body scroll lock and the same pinned full-viewport frame, but the modal
       in it has closed and left an empty document behind. Nothing is open to
       justify the lock, so everything below the fold is unreachable and the
       leaked scroll-lock must still be reported. -->
  <h1>Things</h1>
  <p>This list shows every thing in the workspace, newest first, with its owner and its state.</p>
  <div class="tall">
    <p>The first thing in the list, created this morning by the first owner.</p>
  </div>
  <p>The last thing in the list, below the fold.</p>
  <div class="frame-host" data-testid="framed-modal-host">
    <iframe src="/iframe-modal-frame-closed.html" title="Edit thing" data-testid="framed-modal-frame"></iframe>
  </div>
</body>
</html>
