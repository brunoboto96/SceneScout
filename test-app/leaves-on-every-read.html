<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leaving on every read</title>
  </head>
  <body>
    <main>
      <h1>Leaving on every read</h1>
      <form action="/echo"><button type="submit">Send</button></form>
    </main>
    <script>
      // Each time it loads, moves itself on to a fresh copy of itself, which answers at once, the first time its forms
      // are listed: a page that never stays to be read, however often it is read again.
      const forms = Object.getOwnPropertyDescriptor(Document.prototype, "forms").get;
      let left = false;
      Object.defineProperty(document, "forms", {
        get() {
          if (!left) {
            left = true;
            location.href = "/leaves-on-every-read.html?n=" + (Number(new URLSearchParams(location.search).get("n") || 0) + 1);
          }
          return forms.call(document);
        },
      });
    </script>
  </body>
</html>
