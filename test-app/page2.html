<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Page 2</title></head>
<body>
  <h1>Healthy second page</h1>
  <a href="/index.html" data-testid="page2-home-link">Back home</a>
  <button data-testid="page2-noop-action">Do nothing</button>

  <!-- The dominant real-world upload pattern: a styled button that opens the
       file chooser of a HIDDEN input (display:none, so the collector never
       lists it), which uploads on selection with no submit step. The only
       file input on the page, so the ref-less scout_upload path targets it too. -->
  <button type="button" data-testid="upload-avatar-trigger" id="avatar-trigger">Choose avatar</button>
  <input type="file" id="avatar-input" data-testid="upload-avatar-input" accept="image/*" style="display:none">
  <span id="avatar-result" data-testid="upload-avatar-result">idle</span>
  <script>
    document.getElementById('avatar-trigger').addEventListener('click', () => {
      document.getElementById('avatar-input').click();
    });
    document.getElementById('avatar-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const body = new FormData();
      body.append('avatar', file);
      const out = (t) => { document.getElementById('avatar-result').textContent = t; };
      fetch('/api/avatar', { method: 'POST', body })
        .then((r) => r.json())
        .then((j) => out('avatar ' + j.filename + ' png=' + j.sawPng))
        .catch(() => out('avatar upload failed'));
    });
  </script>
</body>
</html>
