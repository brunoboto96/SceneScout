<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in</title>
  </head>
  <body>
    <!--
      A two-step sign-in, as many identity providers lay it out: the email
      first, then "Next" reveals the password on the same page. The form posts
      to /scripted-signin/session, which sends a right password on to the
      one-time-code step (scripted-code.html) and serves this page again, with
      an error, for a wrong one. That error repeats what was typed, the shape
      of a page that echoes its input, so a scripted sign-in's output is tested
      against a page that puts the credentials on screen.
    -->
    <main>
      <h1>Sign in</h1>
      <!--ERROR-->
      <form method="post" action="/scripted-signin/session" data-testid="signin-form">
        <div id="step-identify">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" data-testid="signin-email-input" />
          <button type="button" id="next" data-testid="signin-next-button">Next</button>
          <button type="button" data-testid="signin-provider-button">Continue with another provider</button>
        </div>
        <div id="step-password" hidden>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" data-testid="signin-password-input" />
          <button type="submit" data-testid="signin-submit-button">Sign in</button>
          <a href="/scripted-signin" data-testid="signin-forgot-link">Forgot password?</a>
        </div>
      </form>
    </main>
    <script>
      const email = document.getElementById("email");
      const reveal = () => {
        if (!email.value) return;
        document.getElementById("step-identify").hidden = true;
        document.getElementById("step-password").hidden = false;
      };
      document.getElementById("next").addEventListener("click", reveal);
      email.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          reveal();
        }
      });
    </script>
  </body>
</html>
