<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Secret fields, framed</title>
  </head>
  <body style="margin: 0">
    <!--
      Secret fields that no attribute names. The first text field is secret
      only by its label, as after a show-password toggle on a field with no
      autocomplete token; the second, alike in all but its label, is not. The
      embedded frame holds the same pair, a password field and an ordinary one,
      so a picture of the page has to paint inside the frame.
    -->
    <main>
      <label for="shown-secret">Password</label>
      <input id="shown-secret" data-testid="shown-secret" type="text" value="Shown-secret-42" style="display: block; width: 240px; height: 40px" />
      <label for="nickname">Nickname</label>
      <input id="nickname" data-testid="nickname" type="text" value="Shown-plain-42" style="display: block; width: 240px; height: 40px" />
      <iframe
        title="Embedded sign-in"
        data-testid="sign-in-frame"
        style="display: block; width: 320px; height: 140px; border: 0"
        srcdoc="<body style='margin:0'><label for='fp'>Account phrase</label><input id='fp' data-testid='frame-secret' type='password' value='Frame-secret-42' style='display:block;width:240px;height:40px'><label for='fn'>Note</label><input id='fn' data-testid='frame-plain' type='text' value='Frame-plain-42' style='display:block;width:240px;height:40px'></body>"
      ></iframe>
    </main>
  </body>
</html>
