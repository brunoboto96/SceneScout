<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Secret fields</title>
  </head>
  <body>
    <!--
      Two fields as alike as they can be: the same kind of label, the same
      previous content, and only the input type differs. What is typed into the
      password one is masked in the log and the result; what is typed into the
      text one is not. The third field is named by nothing but its autocomplete
      token. The PIN is a number field, so a value with letters makes the
      browser refuse the fill, and Playwright's error quotes what it was
      given. The two one-character boxes are a code split one box per
      character, named only "Digit 1" and "Digit 2".
    -->
    <main>
      <h1>Account</h1>
      <form data-testid="secret-form" onsubmit="return false">
        <label for="phrase-hidden">Account phrase</label>
        <input id="phrase-hidden" data-testid="phrase-hidden" type="password" value="Old-phrase-42" />
        <label for="phrase-shown">Account phrase (shown)</label>
        <input id="phrase-shown" data-testid="phrase-shown" type="text" value="Old-shown-42" />
        <label for="app-code">Code from the app</label>
        <input id="app-code" data-testid="app-code" type="text" autocomplete="one-time-code" />
        <label for="pin-number">PIN</label>
        <input id="pin-number" data-testid="pin-number" type="number" />
        <input data-testid="digit-1" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1" />
        <input data-testid="digit-2" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2" />
      </form>
    </main>
  </body>
</html>
