<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gated area (single sign-on)</title>
  </head>
  <body>
    <main>
      <h1 data-testid="sso-gated-heading">Gated area</h1>
      <p>Reports for signed-in members.</p>
    </main>
    <script>
      // An app that signs in through a single sign-on provider on another origin: 1.5 s after load, its token check
      // sends a signed-out visitor to the provider (later than a navigation watches the address, so only a later call
      // can see it). Signed in (the "smoke-auth" flag a storage state sets), the page stays put.
      //   ?idp=<origin>  the provider's origin (the harness's second origin)
      //   ?to=<path>     where on it: the provider's authorize endpoint, or (the contrast) an ordinary page of that site
      //   ?soon=1        the token check answers at once (40 ms after load), inside what a navigation watches
      //   ?soon=2        the same at 300 ms: after the load has settled on a busy machine, still inside what a navigation watches
      //   ?soon=3        the same at 650 ms: after the watch before the origin fence, inside the later one the verdict reads
      //   ?secret=1      the page adds a sign-in state of its own to the address it goes to, so the state is in no
      //                  address the engine was asked for, only in the provider's (what is kept must not hold it)
      addEventListener("load", function () {
        setTimeout(function () {
          try {
            if (localStorage.getItem("smoke-auth") === "yes") return;
          } catch (e) {
            /* storage unavailable — treat as signed out */
          }
          var params = new URLSearchParams(location.search);
          var to = params.get("to");
          if (params.get("secret") === "1") to += (to.indexOf("?") === -1 ? "?" : "&") + "state=" + ["idp", "only", "state", "4c1e"].join("-");
          location.replace(params.get("idp") + to);
        }, { 1: 40, 2: 300, 3: 650 }[new URLSearchParams(location.search).get("soon")] || 1500);
      });
    </script>
  </body>
</html>
